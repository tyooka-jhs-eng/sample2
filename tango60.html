<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>英単語カード学習</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: "Segoe UI", "Helvetica Neue", sans-serif;
      background-color: #eef2f7;
      margin: 0;
      padding: 20px;
      text-align: center;
    }

    .card-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1.5rem;
    }

    .flip-card {
      background-color: transparent;
      width: 250px;
      height: 180px;
      perspective: 1000px;
      cursor: pointer;
    }

    .flip-card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      text-align: center;
      transition: transform 0.6s;
      transform-style: preserve-3d;
    }

    .flip-card.flipped .flip-card-inner {
      transform: rotateY(180deg);
    }

    .flip-card-front, .flip-card-back {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: 12px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 1rem;
      font-size: 1.2rem;
    }

    .flip-card-front {
      background-color: #ffffff;
      color: #333;
    }

    .flip-card-back {
      background-color: #4a90e2;
      color: white;
      transform: rotateY(180deg);
    }

    .controls button {
      margin: 5px;
      padding: 6px 12px;
      font-size: 0.9rem;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    .speak-btn { background-color: #f5a623; color: white; }
    .review-btn { background-color: #7ed321; color: white; }

    .history-btn {
      background-color: #ffffff;
      border-radius: 30px;
      padding: 10px 20px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      text-decoration: none;
      color: #333;
      font-weight: bold;
      cursor: pointer;
      margin-top: 20px;
    }
  </style>
</head>
<body>

<h2>🎓 英単語カード学習</h2>

<select id="list-selector" onchange="renderCards()">
  <option value="list1.json">リスト1：基本名詞</option>
  <option value="list2.json">リスト2：学校生活</option>
  <option value="list3.json">家族・仲間</option>
  <option value="list4.json">食べ物</option>
  <option value="list5.json">自然・環境</option>
  <option value="list6.json">旅行・交通</option>
  <option value="list7.json">時間・季節</option>
  <option value="list8.json">感情・性格</option>
  <option value="list9.json">社会・文化</option>
  <option value="list10.json">その他</option>
</select>

<div class="card-container" id="card-container"></div>

<div id="resultButtonArea" style="margin-top: 30px;">
  <button class="history-btn" onclick="showHistory()">📊 テスト結果を見る</button>
</div>

<script>
  // 最初の読み上げで設定が反映されるように
  speechSynthesis.onvoiceschanged = () => {};

  let vocabulary = [];

  /* -----------------------------
     shuffle
  ----------------------------- */
  function shuffle(array) {
    for (let i = array.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [array[i], array[j]] = [array[j], array[i]];
    }
    return array;
  }

  /* -----------------------------
     Safari / iOS 判定（iPadOS対応）
  ----------------------------- */
  function isIOS() {
    const ua = navigator.userAgent;
    const isIOSDevice =
      /iPhone|iPad|iPod/.test(ua) ||
      (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    const isSafari =
      ua.includes("Safari") &&
      !ua.includes("Chrome") &&
      !ua.includes("Edg");
    return isIOSDevice && isSafari;
  }

  /* -----------------------------
     Web Speech API 判定
     ※ Safari は常に false にする
  ----------------------------- */
  function canUseSpeechAPI() {
    if (isIOS()) return false; // iOS Safari では絶対に使わない
    return ('SpeechRecognition' in window) || ('webkitSpeechRecognition' in window);
  }

  /* -----------------------------
     Web Speech API 初期化
     ※ Safari では null のまま
  ----------------------------- */
  const SpeechRecognition = canUseSpeechAPI()
    ? (window.SpeechRecognition || window.webkitSpeechRecognition)
    : null;
  let recognition = null;

  if (SpeechRecognition) {
    recognition = new SpeechRecognition();
    recognition.lang = "en-US";
  }

  /* -----------------------------
     発音チェック（WebSpeech用）
  ----------------------------- */
  function checkPronunciation(correctWord) {
    if (!canUseSpeechAPI() || !recognition) {
      alert("このブラウザでは自動音声認識が利用できません。");
      return;
    }

    recognition.start();

    recognition.onresult = (event) => {
      let spoken = event.results[0][0].transcript.toLowerCase();
      spoken = spoken.replace(/[.,!?]/g, "").trim();

      const correct = correctWord.toLowerCase();

      const key = "learnedWords";
      const learned = JSON.parse(localStorage.getItem(key)) || {};

      if (!learned[correctWord]) {
        learned[correctWord] = {
          count: 0,
          timestamps: [],
          speechAttempts: 0,
          speechCorrect: 0
        };
      }

      learned[correctWord].speechAttempts += 1;

      if (spoken.includes(correct)) {
        alert("🎉 正しく発音できました！");
        learned[correctWord].speechCorrect += 1;
      } else {
        alert(`❌ もう一度チャレンジ！\n聞こえた単語: ${spoken}`);
      }

      const now = new Date();
      learned[correctWord].timestamps.push(now.toISOString());

      localStorage.setItem(key, JSON.stringify(learned));
    };
  }

  /* -----------------------------
     JSON読み込み
  ----------------------------- */
  async function loadVocabulary() {
    const selectedFile = document.getElementById("list-selector").value;
    const response = await fetch(selectedFile);
    return await response.json();
  }

  /* -----------------------------
     カード表示（Safari 完全対応版）
  ----------------------------- */
  async function renderCards() {
    vocabulary = await loadVocabulary();
    const container = document.getElementById("card-container");
    container.innerHTML = "";

    const shuffled = shuffle([...vocabulary]);

    shuffled.forEach(item => {
      const card = document.createElement("div");
      card.className = "flip-card";

      card.addEventListener("click", (e) => {
        if (e.target.closest("button") || e.target.closest("input")) {
          return;
        }
        card.classList.toggle("flipped");
      });

      card.innerHTML = `
        <div class="flip-card-inner">
          <div class="flip-card-front">
            <strong>${item.word}</strong>

            <div class="controls">
              <button class="speak-btn"
                onclick="event.stopPropagation(); speakExample('${item.example}')">
                🔊 例文
              </button>

              <!-- WebSpeech（Chrome / Edge） -->
              <button id="webSpeechBtn_${item.word}"
                onclick="event.stopPropagation(); checkPronunciation('${item.word}')">
                🎤 発音チェック
              </button>

              <!-- Safari / iOS 用：音声入力欄 -->
              <div id="iosInput_${item.word}" style="display:none; margin-top:10px;">
                <input type="text" id="iosText_${item.word}"
                  placeholder="ここに音声入力してください（iOS）">
                <button onclick="event.stopPropagation(); checkPronunciationIOS('${item.word}')">
                  判定する
                </button>
              </div>
            </div>
          </div>

          <div class="flip-card-back">
            <strong>${item.meaning}</strong>
            <small>${item.example}</small>
            <div class="controls">
              <button class="review-btn"
                onclick="event.stopPropagation(); saveProgress('${item.word}')">
                ✅ 覚えた
              </button>
            </div>
          </div>
        </div>
      `;
      container.appendChild(card);
    });

    const modeIOS = isIOS();
    const modeSpeech = canUseSpeechAPI();

    shuffled.forEach(item => {
      const iosArea = document.getElementById(`iosInput_${item.word}`);
      const webBtn = document.getElementById(`webSpeechBtn_${item.word}`);

      if (modeIOS) {
        // iOS Safari → WebSpeechボタンを差し替え、入力欄を表示
        iosArea.style.display = "block";
        if (webBtn) webBtn.style.display = "none";

        const input = document.getElementById(`iosText_${item.word}`);

        const safariBtn = document.createElement("button");
        safariBtn.textContent = "🎤 発音チェック（iOS）";
        safariBtn.onclick = (e) => {
          e.stopPropagation();
          iosArea.style.display = "block";
          input.value = "";   // ★ 再テスト時に前回入力を自動クリア
          input.focus();      // ★ キーボードを確実に出す
        };

        if (webBtn && webBtn.parentNode) {
          webBtn.parentNode.replaceChild(safariBtn, webBtn);
        }

      } else if (modeSpeech) {
        // WebSpeech対応ブラウザ
        iosArea.style.display = "none";
        if (webBtn) webBtn.style.display = "inline-block";

      } else {
        // その他ブラウザ → テキスト入力のみ
        iosArea.style.display = "block";
        if (webBtn) webBtn.style.display = "none";
      }
    });
  }

  /* -----------------------------
     例文読み上げ
  ----------------------------- */
  function speakExample(text) {
    const utterance = new SpeechSynthesisUtterance(text);

    const rate = parseFloat(localStorage.getItem("speechRate") || "1.0");
    const pitch = parseFloat(localStorage.getItem("speechPitch") || "1.0");
    const voiceIndex = localStorage.getItem("voiceIndex");

    utterance.rate = rate;
    utterance.pitch = pitch;

    const voices = speechSynthesis.getVoices();
    if (voiceIndex !== null && voices[voiceIndex]) {
      utterance.voice = voices[voiceIndex];
    }

    speechSynthesis.speak(utterance);
  }

  /* -----------------------------
     iOS 用：テキスト判定（文章中に単語があれば正解）
  ----------------------------- */
  function checkPronunciationIOS(correctWord) {
    const input = document.getElementById(`iosText_${correctWord}`).value.trim().toLowerCase();
    const correct = correctWord.toLowerCase();

    const key = "learnedWords";
    const learned = JSON.parse(localStorage.getItem(key)) || {};

    if (!learned[correctWord]) {
      learned[correctWord] = {
        count: 0,
        timestamps: [],
        speechAttempts: 0,
        speechCorrect: 0
      };
    }

    learned[correctWord].speechAttempts += 1;

    // ★ 部分一致判定：文章の中に単語が含まれていれば正解
    if (input.includes(correct)) {
      alert("🎉 正しく発音できました！（iOS入力）");
      learned[correctWord].speechCorrect += 1;
    } else {
      alert(`❌ もう一度チャレンジ！\n入力された単語: ${input}`);
    }

    learned[correctWord].timestamps.push(new Date().toISOString());
    localStorage.setItem(key, JSON.stringify(learned));
  }

  /* -----------------------------
     覚えた（count のみ増やす）
  ----------------------------- */
  function saveProgress(wordKey) {
    const key = "learnedWords";
    const learned = JSON.parse(localStorage.getItem(key)) || {};
    const now = new Date();

    if (!learned[wordKey]) {
      learned[wordKey] = {
        count: 1,
        timestamps: [now.toISOString()],
        speechAttempts: 0,
        speechCorrect: 0
      };
    } else {
      learned[wordKey].count += 1;
      learned[wordKey].timestamps.push(now.toISOString());
    }

    localStorage.setItem(key, JSON.stringify(learned));
    alert("記録しました！");
  }

  /* -----------------------------
     テスト結果表示
  ----------------------------- */
  async function showHistory() {
    vocabulary = await loadVocabulary();

    const container = document.getElementById("card-container");
    container.innerHTML = "<h2>📊 テスト結果</h2>";

    const learned = JSON.parse(localStorage.getItem("learnedWords")) || {};

    const learnedArray = Object.keys(learned).map(wordKey => {
      const data = learned[wordKey];
      const lastTime = data.timestamps.length > 0
        ? new Date(data.timestamps[data.timestamps.length - 1])
        : new Date(0);

      return {
        wordKey,
        data,
        lastTime
      };
    });

    learnedArray.sort((a, b) => b.lastTime - a.lastTime);

    const ul = document.createElement("ul");
    ul.style.textAlign = "left";
    ul.style.maxWidth = "600px";
    ul.style.margin = "0 auto";

    let found = false;

    learnedArray.forEach(item => {
      const word = vocabulary.find(w => w.word === item.wordKey);
      if (!word) return;

      found = true;
      const data = item.data;
      const lastTime = item.lastTime.toLocaleString();

      const li = document.createElement("li");
      li.innerHTML = `
        <strong>${word.word}</strong>（${word.meaning}）<br>
        🔁 覚えた回数：${data.count}<br>
        🎤 発音チェック：実施 ${data.speechAttempts} 回 / 正解 ${data.speechCorrect} 回<br>
        📆 最終学習日時：${lastTime}
      `;
      ul.appendChild(li);
    });

    if (found) {
      container.appendChild(ul);
    } else {
      container.innerHTML += "<p>まだ記録がありません。</p>";
    }
  }

  window.onload = () => {
    renderCards();
  };
</script>

</body>
</html>
