<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>英単語カード学習</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: "Segoe UI", "Helvetica Neue", sans-serif;
      background-color: #eef2f7;
      margin: 0;
      padding: 20px;
      text-align: center;
    }

    .card-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1.5rem;
    }

    .flip-card {
      background-color: transparent;
      width: 250px;
      height: 180px;
      perspective: 1000px;
      cursor: pointer;
    }

    .flip-card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      text-align: center;
      transition: transform 0.6s;
      transform-style: preserve-3d;
    }

    .flip-card.flipped .flip-card-inner {
      transform: rotateY(180deg);
    }

    .flip-card-front, .flip-card-back {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: 12px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 1rem;
      font-size: 1.2rem;
    }

    .flip-card-front {
      background-color: #ffffff;
      color: #333;
    }

    .flip-card-back {
      background-color: #4a90e2;
      color: white;
      transform: rotateY(180deg);
    }

    .controls button {
      margin: 5px;
      padding: 6px 12px;
      font-size: 0.9rem;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    .speak-btn { background-color: #f5a623; color: white; }
    .review-btn { background-color: #7ed321; color: white; }
  </style>
</head>

<body>

<h2>🎓 英単語カード学習</h2>

<select id="list-selector" onchange="renderCards()">
  <option value="list1.json">リスト1：基本名詞</option>
  <option value="list2.json">リスト2：学校生活</option>
  <option value="list3.json">自然・環境</option>
  <option value="list4.json">社会・文化</option>
  <option value="list5.json">旅行・交通</option>
  <option value="list6.json">食べ物・健康</option>
  <option value="list7.json">感情・性格</option>
  <option value="list8.json">動物・植物</option>
  <option value="list9.json">時間・季節</option>
  <option value="list10.json">その他</option>
</select>

<div class="card-container" id="card-container"></div>

<script>
let vocabulary = [];

/* -----------------------------
   ★ shuffle 修正版（バグ修正）
----------------------------- */
function shuffle(array) {
  for (let i = array.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [array[i], array[j]] = [array[j], array[i]];  // ← 修正済み
  }
  return array;
}

/* -----------------------------
   ★ 音声認識（Web Speech API）
----------------------------- */
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition = null;

if (SpeechRecognition) {
  recognition = new SpeechRecognition();
  recognition.lang = "en-US";
} else {
  alert("⚠ このブラウザは音声認識に対応していません");
}

/* -----------------------------
   ★ 読み上げ判定（単語 or 例文どちらでも正解）
----------------------------- */
function checkPronunciation(correctWord) {
  if (!recognition) {
    alert("音声認識が使えません");
    return;
  }

  recognition.start();

  recognition.onresult = (event) => {
    let spoken = event.results[0][0].transcript.toLowerCase();

    // 不要な文字を除去
    spoken = spoken.replace(/[.,!?]/g, "");  // 句読点除去
    spoken = spoken.trim();                 // 前後のスペース除去

    const correct = correctWord.toLowerCase();

    // ★ 単語が含まれていれば正解（例文でもOK）
    if (spoken.includes(correct)) {
      alert("🎉 正しく発音できました！");
      saveProgress(correctWord);
    } else {
      alert(`❌ もう一度チャレンジ！\n聞こえた単語: ${spoken}`);
    }
  };
}

/* -----------------------------
   JSON読み込み
----------------------------- */
async function loadVocabulary() {
  const selectedFile = document.getElementById("list-selector").value;
  const response = await fetch(selectedFile);
  return await response.json();
}

/* -----------------------------
   カード表示
----------------------------- */
async function renderCards() {
  vocabulary = await loadVocabulary();
  const container = document.getElementById("card-container");
  container.innerHTML = "";

  const shuffled = shuffle([...vocabulary]);

  shuffled.forEach(item => {
    const card = document.createElement("div");
    card.className = "flip-card";
    card.onclick = () => card.classList.toggle("flipped");

    card.innerHTML = `
      <div class="flip-card-inner">
        <div class="flip-card-front">
          <strong>${item.word}</strong>
          <div class="controls">
            <button class="speak-btn" onclick="event.stopPropagation(); speakExample('${item.example}')">🔊 例文</button>
            <button onclick="event.stopPropagation(); checkPronunciation('${item.word}')">🎤 発音チェック</button>
          </div>
        </div>
        <div class="flip-card-back">
          <strong>${item.meaning}</strong>
          <small>${item.example}</small>
          <div class="controls">
            <button class="review-btn" onclick="event.stopPropagation(); saveProgress('${item.id}')">✅ 覚えた</button>
          </div>
        </div>
      </div>
    `;
    container.appendChild(card);
  });
}

/* -----------------------------
   例文読み上げ
----------------------------- */
function speakExample(text) {
  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = "en-US";
  speechSynthesis.speak(utterance);
}

/* -----------------------------
   学習記録
----------------------------- */
function saveProgress(wordId) {
  const key = "learnedWords";
  const learned = JSON.parse(localStorage.getItem(key)) || {};
  const now = new Date();

  if (!learned[wordId]) {
    learned[wordId] = { count: 1, timestamps: [now.toISOString()] };
  } else {
    learned[wordId].count += 1;
    learned[wordId].timestamps.push(now.toISOString());
  }

  localStorage.setItem(key, JSON.stringify(learned));
  alert("記録しました！");
}

window.onload = () => {
  renderCards();
};
</script>

</body>
</html>
