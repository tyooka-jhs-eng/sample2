<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>英単語カード学習</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: "Segoe UI", "Helvetica Neue", sans-serif;
      background-color: #eef2f7;
      margin: 0;
      padding: 20px;
      text-align: center;
    }

    .card-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1.5rem;
    }

    .flip-card {
      background-color: transparent;
      width: 250px;
      height: 180px;
      perspective: 1000px;
      cursor: pointer;
    }

    .flip-card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      text-align: center;
      transition: transform 0.6s;
      transform-style: preserve-3d;
    }

    .flip-card.flipped .flip-card-inner {
      transform: rotateY(180deg);
    }

    .flip-card-front, .flip-card-back {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: 12px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 1rem;
      font-size: 1.2rem;
    }

    .flip-card-front {
      background-color: #ffffff;
      color: #333;
    }

    .flip-card-back {
      background-color: #4a90e2;
      color: white;
      transform: rotateY(180deg);
    }

    .controls button {
      margin: 5px;
      padding: 6px 12px;
      font-size: 0.9rem;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    .speak-btn { background-color: #f5a623; color: white; }
    .review-btn { background-color: #7ed321; color: white; }

    .history-btn {
      background-color: #ffffff;
      border-radius: 30px;
      padding: 10px 20px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      text-decoration: none;
      color: #333;
      font-weight: bold;
      cursor: pointer;
      margin-top: 20px;
    }
  </style>
</head>

<body>

<h2>🎓 英単語カード学習</h2>

<select id="list-selector" onchange="renderCards()">
  <option value="list1.json">リスト1：基本名詞</option>
  <option value="list2.json">リスト2：学校生活</option>
  <option value="list3.json">家族・仲間</option>
  <option value="list4.json">食べ物</option>
  <option value="list5.json">自然・環境</option>
  <option value="list6.json">旅行・交通</option>
  <option value="list7.json">時間・季節</option>
  <option value="list8.json">感情・性格</option>
  <option value="list9.json">社会・文化</option>
  <option value="list10.json">その他</option>
</select>

<div class="card-container" id="card-container"></div>

<!-- ★ テスト結果ボタン（常に表示） -->
<div id="resultButtonArea" style="margin-top: 30px;">
  <button class="history-btn" onclick="showHistory()">📊 テスト結果を見る</button>
</div>

<script>


  // ★ 追加（iPad_iPhoneかそれ以外かを判定）
function getSpeechMode() {
  const ua = navigator.userAgent;

  const isIpad = ua.includes("iPad") ||
                 (ua.includes("Mac") && navigator.maxTouchPoints > 1);

  const isIphone = ua.includes("iPhone");

  const isSafari = /^((?!chrome|android).)*safari/i.test(ua);

  const canUseSpeechAPI =
    ('SpeechRecognition' in window) || ('webkitSpeechRecognition' in window);

  if (isIpad || isIphone || isSafari) {
    return "ios-input";   // iOS → 音声入力ボタン方式
  }

  if (canUseSpeechAPI) {
    return "web-speech";  // Chrome / Edge → 自動音声認識
  }

  return "none";
}


  // ★ これを追加（最初の読み上げで設定が反映されるようにする）
  speechSynthesis.onvoiceschanged = () => {};

let vocabulary = [];

/* -----------------------------
   shuffle 修正版
----------------------------- */
function shuffle(array) {
  for (let i = array.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [array[i], array[j]] = [array[j], array[i]];
  }
  return array;
}

/* -----------------------------
   Web Speech API 判定
----------------------------- */
function canUseSpeechAPI() {
  return ('SpeechRecognition' in window) || ('webkitSpeechRecognition' in window);
}

/* -----------------------------
   Web Speech API
----------------------------- */
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition = null;

if (SpeechRecognition) {
  recognition = new SpeechRecognition();
  recognition.lang = "en-US";
}

/* -----------------------------
   発音チェック（実施回数・正解回数を記録）
----------------------------- */
function checkPronunciation(correctWord) {
  if (!canUseSpeechAPI() || !recognition) {
    alert("このブラウザでは自動音声認識が利用できません。");
    return;
  }

  recognition.start();

  recognition.onresult = (event) => {
    let spoken = event.results[0][0].transcript.toLowerCase();
    spoken = spoken.replace(/[.,!?]/g, "").trim();

    const correct = correctWord.toLowerCase();

    const key = "learnedWords";
    const learned = JSON.parse(localStorage.getItem(key)) || {};

    // ★ 初期化（必ず speechAttempts と speechCorrect を作る）
    if (!learned[correctWord]) {
      learned[correctWord] = {
        count: 0,
        timestamps: [],
        speechAttempts: 0,
        speechCorrect: 0
      };
    }

    // ★ 発音チェック実施回数
    learned[correctWord].speechAttempts += 1;

　　// ★ 正解判定
    if (spoken.includes(correct)) {
      alert("🎉 正しく発音できました！");
      learned[correctWord].speechCorrect += 1;
    } else {
      alert(`❌ もう一度チャレンジ！\n聞こえた単語: ${spoken}`);
    }

　　// ★ ★ ★ timestamps にも日時を追加（重要）
　　const now = new Date();
　　learned[correctWord].timestamps.push(now.toISOString());

　　// ★ 保存
    localStorage.setItem(key, JSON.stringify(learned));
  };
}

/* -----------------------------
   JSON読み込み
----------------------------- */
async function loadVocabulary() {
  const selectedFile = document.getElementById("list-selector").value;
  const response = await fetch(selectedFile);
  return await response.json();
}

/* -----------------------------
   カード表示
----------------------------- */
async function renderCards() {
  vocabulary = await loadVocabulary();
  const container = document.getElementById("card-container");
  container.innerHTML = "";

  const shuffled = shuffle([...vocabulary]);

  shuffled.forEach(item => {
    const card = document.createElement("div");
    card.className = "flip-card";
    card.onclick = () => card.classList.toggle("flipped");

    card.innerHTML = `
      <div class="flip-card-inner">

<div class="flip-card-front">
  <strong>${item.word}</strong>

  <div class="controls">
    <button class="speak-btn"
      onclick="event.stopPropagation(); speakExample('${item.example}')">🔊 例文</button>

    <!-- ★ iOS 用：音声入力ボタンを使う入力欄 -->
    <div id="iosInput_${item.word}" style="display:none; margin-top:10px;">
      <input type="text" id="iosSpeech_${item.word}"
             placeholder="🎤 音声入力で単語を読み上げてください">
      <button onclick="event.stopPropagation(); checkIOSPronunciation('${item.word}')">
        判定
      </button>
    </div>

    <!-- ★ Web Speech API 用：自動音声認識 -->
    <button id="webSpeechBtn_${item.word}"
      onclick="event.stopPropagation(); checkPronunciation('${item.word}')">
      🎤 発音チェック
    </button>
  </div>
</div>
        
        </div>
      </div>
    `;
    container.appendChild(card);
  });
}

/* -----------------------------
   例文読み上げ
----------------------------- */
function speakExample(text) {
  const utterance = new SpeechSynthesisUtterance(text);

  // ★ index.html で保存した設定を読み込む
  const rate = parseFloat(localStorage.getItem("speechRate") || "1.0");
  const pitch = parseFloat(localStorage.getItem("speechPitch") || "1.0");
  const voiceIndex = localStorage.getItem("voiceIndex");

  utterance.rate = rate;
  utterance.pitch = pitch;

  // ★ 声の種類（voiceIndex）が設定されていれば反映
  const voices = speechSynthesis.getVoices();
  if (voiceIndex !== null && voices[voiceIndex]) {
    utterance.voice = voices[voiceIndex];
  }

  speechSynthesis.speak(utterance);
}
/* -----------------------------
   覚えた（count のみ増やす）
----------------------------- */
function saveProgress(wordKey) {
  const key = "learnedWords";
  const learned = JSON.parse(localStorage.getItem(key)) || {};
  const now = new Date();

  // ★ 初期化（speechAttempts と speechCorrect も必ず作る）
  if (!learned[wordKey]) {
    learned[wordKey] = {
      count: 1,
      timestamps: [now.toISOString()],
      speechAttempts: 0,
      speechCorrect: 0
    };
  } else {
    learned[wordKey].count += 1;
    learned[wordKey].timestamps.push(now.toISOString());
  }

  localStorage.setItem(key, JSON.stringify(learned));
  alert("記録しました！");
}

/* -----------------------------
   iOS用の判定関数を追加
----------------------------- */

function checkIOSPronunciation(correctWord) {
  const input = document.getElementById(`iosSpeech_${correctWord}`).value.trim().toLowerCase();
  const correct = correctWord.toLowerCase();

  const key = "learnedWords";
  const learned = JSON.parse(localStorage.getItem(key)) || {};

  if (!learned[correctWord]) {
    learned[correctWord] = {
      count: 0,
      timestamps: [],
      speechAttempts: 0,
      speechCorrect: 0
    };
  }

  learned[correctWord].speechAttempts += 1;

  if (input.includes(correct)) {
    alert("🎉 正しく発音できました！（iOS音声入力）");
    learned[correctWord].speechCorrect += 1;
  } else {
    alert(`❌ もう一度チャレンジ！\n入力された単語: ${input}`);
  }

  learned[correctWord].timestamps.push(new Date().toISOString());
  localStorage.setItem(key, JSON.stringify(learned));
}
/* -----------------------------
   テスト結果表示
----------------------------- */
async function showHistory() {
  vocabulary = await loadVocabulary();

  const container = document.getElementById("card-container");
  container.innerHTML = "<h2>📊 テスト結果</h2>";

  const learned = JSON.parse(localStorage.getItem("learnedWords")) || {};

  // ★ learned を配列に変換
  const learnedArray = Object.keys(learned).map(wordKey => {
    const data = learned[wordKey];
    const lastTime = data.timestamps.length > 0
      ? new Date(data.timestamps[data.timestamps.length - 1])
      : new Date(0); // 予備（空の場合）

    return {
      wordKey,
      data,
      lastTime
    };
  });

  // ★ 最終学習日時が新しい順に並び替え
  learnedArray.sort((a, b) => b.lastTime - a.lastTime);

  const ul = document.createElement("ul");
  ul.style.textAlign = "left";
  ul.style.maxWidth = "600px";
  ul.style.margin = "0 auto";

  let found = false;

  // ★ 並び替え後の順番で表示
  learnedArray.forEach(item => {
    const word = vocabulary.find(w => w.word === item.wordKey);
    if (!word) return;

    found = true;
    const data = item.data;
    const lastTime = item.lastTime.toLocaleString();

    const li = document.createElement("li");
    li.innerHTML = `
      <strong>${word.word}</strong>（${word.meaning}）<br>
      🔁 覚えた回数：${data.count}<br>
      🎤 発音チェック：実施 ${data.speechAttempts} 回 / 正解 ${data.speechCorrect} 回<br>
      📆 最終学習日時：${lastTime}
    `;
    ul.appendChild(li);
  });

  if (found) {
    container.appendChild(ul);
  } else {
    container.innerHTML += "<p>まだ記録がありません。</p>";
  }
}

  const container = document.getElementById("card-container");
  container.innerHTML = "";

}


};
</script>

</body>
</html>
