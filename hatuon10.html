<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Pronunciation Practice Pro</title>

  <style>
    body { font-family: sans-serif; text-align: center; padding: 20px; }
    #question, #result { font-size: 20px; margin: 20px; }
    #inputArea { margin-top: 20px; }
  </style>
</head>

<body>
  <h2>🎙️ Pronunciation Practice Pro（発音 試作2：iPad＋文章対応 完全版）</h2>
  <p id="question">Press the button to begin!</p>

  <button onclick="startPractice()">Start Speaking</button>

  <div id="inputArea"></div>

  <div id="result">Result will appear here...</div>

  <p>　</p>
  <button onclick="showHistory()">End Session & View Results</button>
  <div id="history"></div>

<script>
/* -----------------------------
   フレーズ一覧
----------------------------- */
const phrases = [
  "I would like a hamburger",
  "Can you help me, please?",
  "Where is the nearest station?",
  "I have two brothers and one sister",
  "This ice cream is delicious",
  "Let’s go to the library tomorrow",
  "My favorite subject is English",
  "What time is it now?"
];

let currentPhrase = "";

/* -----------------------------
   ブラウザ判定
----------------------------- */
function getSpeechMode() {
  const canUseSpeechAPI =
    ('SpeechRecognition' in window) || ('webkitSpeechRecognition' in window);

  const isSafari = /^((?!chrome|android).)*safari/i.test(navigator.userAgent);

  const isIpad =
    navigator.userAgent.includes("iPad") ||
    (navigator.userAgent.includes("Mac") && navigator.maxTouchPoints > 1);

  if (isIpad || isSafari) {
    return "ipad-input";   // iPad Safari → テキスト入力モード
  }

  if (canUseSpeechAPI) {
    return "web-speech";   // Chrome / Edge → Web Speech API
  }

  return "none";           // どちらも使えない
}

/* -----------------------------
   発音練習開始
----------------------------- */
function startPractice() {
  currentPhrase = phrases[Math.floor(Math.random() * phrases.length)];
  document.getElementById("question").innerText = `Say: "${currentPhrase}"`;

  const mode = getSpeechMode();
  const area = document.getElementById("inputArea");
  area.innerHTML = ""; // 初期化

  if (mode === "ipad-input") {
    // ★ iPad Safari → テキスト入力欄（キーボードのマイクで音声入力）
    area.innerHTML = `
      <p>🎤 iPad入力モード（キーボードのマイクで音声入力できます）</p>
      <input id="iosInput" type="text" placeholder="ここに入力してください" style="width:80%; font-size:18px;">
      <button onclick="checkIOS()">判定する</button>
    `;
    const input = document.getElementById("iosInput");
    input.focus();
    return;
  }

  if (mode === "web-speech") {
    // ★ Chrome / Edge → Web Speech API
    const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
    recognition.lang = 'en-US';
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;

    recognition.onresult = function(event) {
      const transcript = event.results[0][0].transcript;
      handleResult(transcript);
    };

    recognition.onerror = function(event) {
      document.getElementById("result").innerText = `Error: ${event.error}`;
    };

    recognition.start();
    return;
  }

  // ★ その他ブラウザ → テキスト入力
  area.innerHTML = `
    <p>⌨ テキスト入力モード</p>
    <input id="iosInput" type="text" placeholder="ここに入力してください" style="width:80%; font-size:18px;">
    <button onclick="checkIOS()">判定する</button>
  `;
  const input = document.getElementById("iosInput");
  input.focus();
}

/* -----------------------------
   iPad / テキスト入力判定
----------------------------- */
function checkIOS() {
  const input = document.getElementById("iosInput");
  const transcript = input.value.trim();
  if (!transcript) return;

  handleResult(transcript);

  // ★ 判定後に入力欄を空にして、次の入力に備える
  input.value = "";
  input.focus();
}

/* -----------------------------
   判定処理（単語一致＋文章一致＋類似度）
----------------------------- */
function handleResult(transcript) {
  const expected = currentPhrase;
  const transcriptLower = transcript.toLowerCase();
  const expectedLower = expected.toLowerCase();

  let score = 0;

  // ① 完全一致（フレーズ全体が同じ）
  if (transcriptLower === expectedLower) {
    score = 100;

  // ② 文章の中に expected が含まれている場合
  } else if (transcriptLower.includes(expectedLower)) {
    score = 95;

  // ③ 類似度判定（近いが少し違う場合）
  } else {
    score = calculateSimilarityScore(expectedLower, transcriptLower);
  }

  saveStudentRecord("student_A", expected, score);

  const resultDiv = document.getElementById("result");
  resultDiv.innerHTML = `
    You said: "<strong>${transcript}</strong>"<br>
    🎯 Similarity Score: <strong>${score}%</strong>
  `;

  if (score >= 90) {
    resultDiv.innerHTML += "<br>✅ Excellent pronunciation!";
  } else if (score >= 70) {
    resultDiv.innerHTML += "<br>👍 Good, but try saying it more clearly.";
  } else {
    resultDiv.innerHTML += `<br>❌ Needs improvement. Try repeating: "<strong>${expected}</strong>"`;
  }
}

/* -----------------------------
   類似度判定（レーベンシュタイン距離）
----------------------------- */
function calculateSimilarityScore(a, b) {
  const distance = levenshteinDistance(a.toLowerCase(), b.toLowerCase());
  const maxLength = Math.max(a.length, b.length);
  return Math.round((1 - distance / maxLength) * 100);
}

function levenshteinDistance(a, b) {
  const dp = Array.from({ length: a.length + 1 }, () =>
    Array(b.length + 1).fill(0)
  );
  for (let i = 0; i <= a.length; i++) dp[i][0] = i;
  for (let j = 0; j <= b.length; j++) dp[0][j] = j;

  for (let i = 1; i <= a.length; i++) {
    for (let j = 1; j <= b.length; j++) {
      const cost = a[i - 1] === b[j - 1] ? 0 : 1;
      dp[i][j] = Math.min(
        dp[i - 1][j] + 1,
        dp[i][j - 1] + 1,
        dp[i - 1][j - 1] + cost
      );
    }
  }
  return dp[a.length][b.length];
}

/* -----------------------------
   ローカル保存
----------------------------- */
function saveStudentRecord(studentId, phrase, score) {
  const record = {
    phrase: phrase,
    score: score,
    date: new Date().toLocaleDateString()
  };

  let history = JSON.parse(localStorage.getItem(studentId)) || [];
  history.push(record);
  localStorage.setItem(studentId, JSON.stringify(history));
}

/* -----------------------------
   履歴表示
----------------------------- */
function showHistory() {
  const studentId = "student_A";
  const history = JSON.parse(localStorage.getItem(studentId)) || [];
  const container = document.getElementById("history");

  if (history.length === 0) {
    container.innerHTML = "<p>📭 No records found yet.</p>";
    return;
  }

  let html = "<h3>📋 Your Practice History</h3><ul>";
  history.forEach(entry => {
    html += `<li><strong>${entry.date}</strong>: “${entry.phrase}” → <span style="color:blue;">${entry.score}%</span></li>`;
  });
  html += "</ul>";
  container.innerHTML = html;
}
</script>

</body>
</html>
